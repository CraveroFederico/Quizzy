<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizzy - Studente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Layout extra-largo per far respirare i dati */
    .container-wide {
      max-width: 95%;
      margin: 0 auto;
    }
    /* Card personalizzate per le statistiche */
    .stats-card {
      border-radius: 15px;
      background: white;
      padding: 25px;
      height: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: none;
    }
    /* Badge voti personalizzati */
    .voto-badge {
      font-size: 0.9rem;
      font-weight: bold;
      padding: 8px 15px;
      border-radius: 50px;
    }
  </style>
</head>

<body>

  <header class="topbar slide-down d-flex justify-content-between align-items-center">
    <div>
      <span class="logo">Quizzy</span>
      <span class="badge">Dashboard</span>
    </div>

    <button onclick="logout()" class="btn btn-warning">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>
  </header>

  <div class="container-wide mt-4">

    <div class="mb-5">
        <h1 class="fade-in fw-bold">I tuoi quiz</h1>
        <p class="page-intro fade-in fade-delay-1 text-muted">Seleziona un professore e mettiti alla prova.</p>

        <div id="quiz_list" class="fade-in fade-delay-2 mt-4">
            </div>
    </div>

    <hr class="fade-in fade-delay-2 my-5">

    <div class="row fade-in fade-delay-3 g-4 pb-5">
        
        <div class="col-lg-8">
            <div class="stats-card">
                <h2 class="mb-4 text-warning fw-bold h4">
                    <i class="bi bi-graph-up-arrow me-2"></i>Andamento Voti
                </h2>
                <div style="position: relative; height: 380px;">
                    <canvas id="studentChart"></canvas>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="stats-card">
                <h2 class="mb-4 text-primary fw-bold h4">
                    <i class="bi bi-clock-history me-2"></i>Ultimi 5 Quiz
                </h2>
                <ul id="lista_ultimi_quiz" class="list-group list-group-flush">
                    <li class="list-group-item text-muted text-center py-5">Nessun quiz svolto finora</li>
                </ul>
            </div>
        </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
  
  <script>
    var div = document.getElementById("quiz_list");

    // 1. Carica lista professori
    function mostraSceltaProfessore() {
        fetch("/get_professori")
            .then(res => res.json())
            .then(professori => {
                div.innerHTML = "<h4 class='text-secondary mb-3'>Scegli un professore:</h4>"
                professori.forEach(p => {
                    var btn = document.createElement("button")
                    btn.innerText = p.username
                    btn.className = "btn btn-warning m-2 px-4 shadow-sm fw-bold"
                    btn.onclick = function () { caricaQuizProf(this.innerText) }
                    div.appendChild(btn)
                })
            })
    }

    // 2. Carica quiz del professore
    function caricaQuizProf(prof) {
    localStorage.setItem("professore", prof)
    var studente = localStorage.getItem("username")
    
    fetch("/get_quiz_prof/" + prof)
        .then(res => res.json())
        .then(data => {
            div.innerHTML = `
                <div class='d-flex align-items-center mb-4'>
                    <button class='btn btn-sm btn-secondary me-3' onclick='mostraSceltaProfessore()'>
                        <i class='bi bi-arrow-left'></i>
                    </button>
                    <h3 class='m-0'>Quiz di ${prof}</h3>
                </div>`;
            
            if (data.length === 0) {
                div.innerHTML += `<div class="alert alert-info shadow-sm">
                    <i class="bi bi-info-circle me-2"></i> Questo professore non ha ancora somministrato alcun quiz.
                </div>`;
                return;
            }

            var containerCards = document.createElement("div")
            div.appendChild(containerCards)

            data.forEach(q => {
                fetch("/check_quiz_done/" + q.titolo + "/" + studente)
                    .then(res => res.json())
                    .then(check => {
                        var card = document.createElement("div")
                        card.className = "quiz_card mb-3 d-flex justify-content-between align-items-center p-3 shadow-sm border-0"
                        card.style.background = "white";

                        if (check.done) {
                            card.innerHTML = `<strong>${q.titolo}</strong> 
                                <span class='text-success fw-bold'><i class='bi bi-check-circle-fill'></i> Completato</span>`
                        } else {
                            card.innerHTML = `<strong>${q.titolo}</strong> 
                                <button class='btn btn-primary btn-sm px-4' onclick='startQuiz("${q.titolo}")'>Inizia</button>`
                        }
                        containerCards.appendChild(card)
                    })
            })
        })
}

    // 3. Genera Statistiche (Grafico + Lista con voti colorati)
    function generaStatistiche() {
        var studente = localStorage.getItem("username");
        fetch("/get_student_stats/" + studente)
            .then(res => res.json())
            .then(data => {
                if (data.length === 0) return;

                // --- GRAFICO ---
                const labels = data.map(item => item.quiz);
                const voti = data.map(item => item.voto);
                const ctx = document.getElementById('studentChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Voto (Decimi)',
                            data: voti,
                            borderColor: '#ffc107',
                            backgroundColor: 'rgba(255, 193, 7, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.3,
                            pointRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { y: { beginAtZero: true, max: 10 } }
                    }
                });

                // --- CRONOLOGIA CON VOTI ---
                var listaUl = document.getElementById("lista_ultimi_quiz");
                listaUl.innerHTML = ""; 
                
                const ultimiCinque = data.slice(-5).reverse();
                ultimiCinque.forEach(item => {
                    var li = document.createElement("li");
                    li.className = "list-group-item d-flex justify-content-between align-items-center border-0 border-bottom px-0 py-3";
                    
                    // Colore del badge: verde se >= 6, rosso se < 6
                    let badgeClass = item.voto >= 6 ? "bg-success" : "bg-danger";

                    li.innerHTML = `
                        <span><i class="bi bi-journal-check text-success me-2"></i> <strong>${item.quiz}</strong></span>
                        <span class="voto-badge badge ${badgeClass} text-white">Voto: ${item.voto}</span>
                    `;
                    listaUl.appendChild(li);
                });
            });
    }

    // Inizializza la pagina
    mostraSceltaProfessore();
    generaStatistiche();

  </script>

</body>
</html>
