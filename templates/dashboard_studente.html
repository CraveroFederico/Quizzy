<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizzy - Studente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <header class="topbar slide-down">
    <span class="logo">Quizzy</span>
    <span class="badge">Studente</span>
  </header>

  <div class="container">

    <h1 class="fade-in">I tuoi quiz</h1>
    <p class="page-intro fade-in fade-delay-1">Seleziona un quiz per iniziare.</p>

    <div id="quiz_list" class="fade-in fade-delay-2"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
  <script>

    var div = document.getElementById("quiz_list")

    // 1️⃣ carica professori
    fetch("/get_professori")
      .then(res => res.json())
      .then(professori => {

        div.innerHTML = "<h3>Scegli un professore</h3>"

        for (var i = 0; i < professori.length; i++) {

          var p = professori[i]

          var btn = document.createElement("button")
          btn.innerText = p.username
          btn.className = "btn btn-warning m-2"

          btn.onclick = function () {

            caricaQuizProf(this.innerText)

          }

          div.appendChild(btn)

        }

      })

    // 2️⃣ carica quiz di un professore
    function caricaQuizProf(prof) {

      localStorage.setItem("professore", prof)

      fetch("/get_quiz_prof/" + prof)
        .then(res => res.json())
        .then(data => {

          div.innerHTML = "<h3>Quiz di " + prof + "</h3>"

          for (var i = 0; i < data.length; i++) {

            var q = data[i]


            var studente = localStorage.getItem("username")

            fetch("/check_quiz_done/" + q.titolo + "/" + studente)
              .then(res => res.json())
              .then(check => {

                var card = document.createElement("div")
                card.className = "quiz_card"

                if (check.done) {

                  card.innerHTML =
                    "<h3>" + q.titolo + "</h3>" +
                    "<p style='color:green; font-weight:bold;'>✔ Già completato</p>"

                } else {

                  card.innerHTML =
                    "<h3>" + q.titolo + "</h3>" +
                    "<button onclick='startQuiz(\"" + q.titolo + "\")'>Inizia</button>"

                }

                div.appendChild(card)

              })
            div.appendChild(card)

          }

        })

    }

  </script>

</body>

</html>
