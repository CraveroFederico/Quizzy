<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizzy - Studente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <header class="topbar slide-down d-flex justify-content-between align-items-center">

    <div>
      <span class="logo">Quizzy</span>
      <span class="badge">Dashboard</span>
    </div>

    <button onclick="logout()" class="btn btn-warning">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>

  </header>

  <div class="container">

    <h1 class="fade-in">I tuoi quiz</h1>
    <p class="page-intro fade-in fade-delay-1">Seleziona un quiz per iniziare.</p>

    <div id="quiz_list" class="fade-in fade-delay-2"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
  <script>

    var div = document.getElementById("quiz_list")

// 1️⃣ Funzione per caricare la lista professori
function mostraSceltaProfessore() {
    fetch("/get_professori")
        .then(res => res.json())
        .then(professori => {
            div.innerHTML = "<h3>Scegli un professore</h3>"

            professori.forEach(p => {
                var btn = document.createElement("button")
                btn.innerText = p.username
                btn.className = "btn btn-warning m-2"
                btn.onclick = function () {
                    caricaQuizProf(this.innerText)
                }
                div.appendChild(btn)
            })
        })
}

// Avvio iniziale
mostraSceltaProfessore()

// 2️⃣ Carica quiz di un professore (con tasto indietro)
function caricaQuizProf(prof) {
    localStorage.setItem("professore", prof)
    var studente = localStorage.getItem("username")

    fetch("/get_quiz_prof/" + prof)
        .then(res => res.json())
        .then(data => {
            // Puliamo il div e aggiungiamo il tasto per tornare ai professori
            div.innerHTML = "<h3>Quiz di " + prof + "</h3>"
            
            var btnIndietro = document.createElement("button")
            btnIndietro.innerHTML = "<i class='bi bi-arrow-left'></i> Torna ai professori"
            btnIndietro.className = "btn btn-secondary mb-3"
            btnIndietro.onclick = mostraSceltaProfessore // Richiama la funzione 1
            
            div.appendChild(btnIndietro)

            // Contenitore per le card (per non metterle sopra al tasto indietro)
            var containerCards = document.createElement("div")
            div.appendChild(containerCards)

            data.forEach(q => {
                fetch("/check_quiz_done/" + q.titolo + "/" + studente)
                    .then(res => res.json())
                    .then(check => {
                        var card = document.createElement("div")
                        card.className = "quiz_card mb-3"

                        if (check.done) {
                            card.innerHTML = 
                                "<h3>" + q.titolo + "</h3>" +
                                "<p style='color:green; font-weight:bold;'>✔ Già completato</p>"
                        } else {
                            card.innerHTML = 
                                "<h3>" + q.titolo + "</h3>" +
                                "<button class='btn btn-primary' onclick='startQuiz(\"" + q.titolo + "\")'>Inizia</button>"
                        }
                        containerCards.appendChild(card)
                    })
            })
        })
}

  </script>

</body>

</html>
