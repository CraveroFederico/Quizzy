<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizzy - Docente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <header class="topbar slide-down d-flex justify-content-between align-items-center">

    <div>
      <span class="logo">Quizzy</span>
      <span class="badge">Dashboard</span>
    </div>

    <button onclick="logout()" class="btn btn-warning">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>

  </header>

  <div class="container">

    <h1 class="fade-in">Dashboard</h1>
    <p class="page-intro fade-in fade-delay-1">Gestisci i tuoi quiz e consulta i risultati degli studenti.</p>

    <!-- I tuoi quiz -->
    <h2 class="fade-in fade-delay-1"><i class="bi bi-collection me-2"></i>I tuoi quiz</h2>
    <div id="quiz_docente" class="fade-in fade-delay-2"></div>

    <hr>

    <!-- Bottone per aprire la sezione Crea quiz -->
    <div class="fade-in fade-delay-2">
      <button class="btn-toggle-section" type="button" data-bs-toggle="collapse" data-bs-target="#creaQuizSection"
        aria-expanded="false" aria-controls="creaQuizSection">
        <i class="bi bi-plus-circle me-2"></i>Crea un nuovo quiz
      </button>
    </div>

    <div class="collapse" id="creaQuizSection">
      <div class="panel mt-3">
        <h2 style="margin-top:0;"><i class="bi bi-pencil-square me-2"></i>Crea un nuovo quiz</h2>
        <input type="text" id="titolo_quiz" placeholder="Titolo del quiz">
        <button onclick="createQuiz()" style="margin-top:4px;">
          <i class="bi bi-check-lg"></i> Crea quiz
        </button>
      </div>
    </div>

    <hr>

    <!-- Bottone per aprire la sezione Aggiungi domanda -->
    <div class="fade-in fade-delay-2">
      <button class="btn-toggle-section" type="button" data-bs-toggle="collapse"
        data-bs-target="#aggiungiDomandaSection" aria-expanded="false" aria-controls="aggiungiDomandaSection">
        <i class="bi bi-patch-question me-2"></i>Aggiungi domanda
      </button>
    </div>

    <div class="collapse" id="aggiungiDomandaSection">
      <div class="panel mt-3">
        <h2 style="margin-top:0;"><i class="bi bi-patch-question me-2"></i>Aggiungi domanda</h2>
        <p class="small text-muted">Scrivi l'opzione e clicca il pallino a sinistra per indicare quella corretta.</p>

        <input id="quiz_nome" placeholder="Titolo del quiz" class="form-control mb-2">
        <input id="domanda" placeholder="Testo della domanda" class="form-control mb-3">

        <div id="opzioni_container"></div>
        <button onclick="aggiungiOpzione()" type="button" class="btn btn-sm btn-outline-secondary mb-3">
          <i class="bi bi-plus-circle"></i> Aggiungi opzione
        </button>

        <button onclick="addQuestion()" class="btn btn-primary w-100">
          <i class="bi bi-plus-lg"></i> Salva Domanda
        </button>
        <p id="msg" class="mt-2 text-primary"></p>
      </div>
    </div>

    <hr>

    <!-- Risultati -->
    <h2 class="fade-in fade-delay-2"><i class="bi bi-bar-chart-line me-2"></i>Risultati</h2>
    <div id="risultati" class="fade-in fade-delay-3"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
  <script>
    var docente = localStorage.getItem("username");
    caricaQuiz();
  </script>

</body>

</html>
