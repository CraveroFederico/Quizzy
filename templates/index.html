<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizzy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* ── Auth layout ── */
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: min(420px, 100%);
      padding: 48px 40px 40px;
      position: relative;
    }

    /* ── Branding inside box ── */
    .auth-brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .auth-brand .logo {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--accent);
      letter-spacing: -.5px;
      display: block;
      line-height: 1;
    }

    .auth-brand .tagline {
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    /* ── Tab switcher ── */
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 32px;
      gap: 0;
    }

    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      padding: 10px 0;
      font-family: var(--font-body);
      font-size: .9rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color .2s, border-color .2s;
      border-radius: 0;
      display: block;
      text-align: center;
      gap: 0;
      box-shadow: none;
    }

    .auth-tab:hover {
      color: var(--accent);
      background: none;
      box-shadow: none;
      transform: none;
    }

    .auth-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
      background: none;
    }

    /* ── Panels ── */
    .auth-panel {
      display: none;
    }

    .auth-panel.active {
      display: block;
      animation: fadeInUp .35s ease forwards;
    }

    /* ── Field label ── */
    .field-label {
      display: block;
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text-secondary);
      margin: 16px 0 4px;
    }

    .auth-panel input,
    .auth-panel select {
      margin: 0;
    }

    /* ── Submit button ── */
    .auth-submit {
      width: 100%;
      margin-top: 28px;
      padding: 12px;
      font-size: .95rem;
      font-weight: 600;
      justify-content: center;
      border-radius: var(--radius-md);
    }

    /* ── Role selector ── */
    .role-group {
      display: flex;
      gap: 10px;
      margin: 0;
    }

    .role-option {
      flex: 1;
      position: relative;
    }

    .role-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .role-option label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: .85rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg);
      transition: all .15s;
      margin: 0;
    }

    .role-option label i {
      font-size: 1.3rem;
    }

    .role-option label:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }

    .role-option input[type="radio"]:checked + label {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }

    /* ── Feedback message ── */
    #message {
      font-size: .85rem;
      text-align: center;
      margin-top: 14px;
      min-height: 20px;
      padding: 0;
    }

    /* Topbar hidden on auth page */
    .topbar-auth {
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-box fade-in">

      <!-- Branding -->
      <div class="auth-brand">
        <span class="logo">Quizzy</span>
        <span class="tagline">Piattaforma didattica</span>
      </div>

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">
          <i class="bi bi-box-arrow-in-right me-1"></i>Accedi
        </button>
        <button class="auth-tab" onclick="switchTab('register')">
          <i class="bi bi-person-plus me-1"></i>Registrati
        </button>
      </div>

      <!-- Login panel -->
      <div class="auth-panel active" id="panel-login">
        <label class="field-label" for="login_username">Username</label>
        <input id="login_username" placeholder="Il tuo username">

        <label class="field-label" for="login_password">Password</label>
        <input id="login_password" type="password" placeholder="••••••••">

        <button class="auth-submit" onclick="login()">
          <i class="bi bi-unlock"></i> Accedi
        </button>
      </div>

      <!-- Register panel -->
      <div class="auth-panel" id="panel-register">
        <label class="field-label" for="reg_username">Username</label>
        <input id="reg_username" placeholder="Scegli uno username">

        <label class="field-label" for="reg_password">Password</label>
        <input id="reg_password" type="password" placeholder="••••••••">

        <label class="field-label">Ruolo</label>
        <div class="role-group">
          <div class="role-option">
            <input type="radio" name="reg_ruolo" id="ruolo_studente" value="studente" checked>
            <label for="ruolo_studente">
              <i class="bi bi-mortarboard"></i>
              Studente
            </label>
          </div>
          <div class="role-option">
            <input type="radio" name="reg_ruolo" id="ruolo_docente" value="docente">
            <label for="ruolo_docente">
              <i class="bi bi-person-workspace"></i>
              Docente
            </label>
          </div>
        </div>

        <button class="auth-submit" onclick="registerNew()">
          <i class="bi bi-person-check"></i> Crea account
        </button>
      </div>

      <p id="message"></p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
      });
      document.getElementById('panel-login').classList.toggle('active', tab === 'login');
      document.getElementById('panel-register').classList.toggle('active', tab === 'register');
      document.getElementById('message').textContent = '';
    }

    // Wrapper per la registrazione: legge il radio invece del select
    function registerNew() {
      const ruolo = document.querySelector('input[name="reg_ruolo"]:checked').value;
      // Crea un select temporaneo con il valore corretto per compatibilità con script.js
      const fakeSelect = document.createElement('select');
      fakeSelect.id = 'reg_ruolo';
      fakeSelect.style.display = 'none';
      const opt = document.createElement('option');
      opt.value = ruolo;
      opt.selected = true;
      fakeSelect.appendChild(opt);
      document.body.appendChild(fakeSelect);
      register();
      document.body.removeChild(fakeSelect);
    }
  </script>
</body>
</html>
