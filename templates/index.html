<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizzy - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fa; }
    .auth-box { background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; padding: 30px; }
    .auth-tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
    .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #666; font-weight: bold; }
    .auth-tab.active { color: #0d6efd; border-bottom: 2px solid #0d6efd; }
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
    .auth-submit { width: 100%; margin-top: 20px; padding: 12px; border-radius: 8px; border: none; background: #0d6efd; color: white; font-weight: bold; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="text-center mb-4">
        <h2 class="text-primary fw-bold">Quizzy</h2>
        <small class="text-muted">Accedi alla tua area personale</small>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Accedi</div>
        <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Registrati</div>
      </div>

      <div id="panel-login" class="auth-panel active">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="login_username" class="form-control" placeholder="Il tuo username">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="login_password" class="form-control" placeholder="••••••••">
        </div>
        <button class="auth-submit" onclick="login()">Accedi</button>
      </div>

      <div id="panel-register" class="auth-panel">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="reg_username" class="form-control" placeholder="Scegli username">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="reg_password" class="form-control" placeholder="Crea password">
        </div>
        <div class="mb-3">
            <label class="form-label">Ruolo</label>
            <div class="d-flex gap-3">
                <input type="radio" name="reg_ruolo" value="studente" checked id="r_stud"> <label for="r_stud">Studente</label>
                <input type="radio" name="reg_ruolo" value="docente" id="r_doc"> <label for="r_doc">Docente</label>
            </div>
        </div>
        <button class="auth-submit" onclick="registerNew()">Registrati</button>
      </div>

      <p id="message" class="text-center mt-3 text-danger"></p>
    </div>
  </div>

  <script src="/static/script.js"></script>
  <script>
    function switchTab(mode) {
      document.getElementById('tab-login').classList.toggle('active', mode==='login');
      document.getElementById('tab-register').classList.toggle('active', mode==='register');
      document.getElementById('panel-login').classList.toggle('active', mode==='login');
      document.getElementById('panel-register').classList.toggle('active', mode==='register');
    }

    function registerNew() {
      const ruolo = document.querySelector('input[name="reg_ruolo"]:checked').value;
      const fakeSelect = document.createElement('select');
      fakeSelect.id = 'reg_ruolo';
      fakeSelect.innerHTML = `<option value="${ruolo}" selected></option>`;
      document.body.appendChild(fakeSelect);
      register();
      document.body.removeChild(fakeSelect);
    }
  </script>
</body>
</html>
