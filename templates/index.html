<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizzy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header class="topbar slide-down">
    <span class="logo">Quizzy</span>
    <span class="badge">Piattaforma didattica</span>
  </header>

  <div class="container">

    <h1 class="fade-in">Benvenuto</h1>
    <p class="page-intro fade-in fade-delay-1">Accedi o crea un account per continuare.</p>

    <div class="card fade-in fade-delay-2 hover-lift">
      <h2><i class="bi bi-box-arrow-in-right me-2"></i>Accedi</h2>
      <input id="login_username" placeholder="Username">
      <input id="login_password" type="password" placeholder="Password">
      <button onclick="login()" style="width:100%; margin-top:8px;">
        <i class="bi bi-unlock"></i> Accedi
      </button>
    </div>

    <div class="card fade-in fade-delay-3 hover-lift">
      <h2><i class="bi bi-person-plus me-2"></i>Registrazione</h2>
      <input id="reg_username" placeholder="Username">
      <input id="reg_password" type="password" placeholder="Password">
      <select id="reg_ruolo">
        <option value="studente">Studente</option>
        <option value="docente">Docente</option>
      </select>
      <button onclick="register()" style="width:100%; margin-top:8px;">
        <i class="bi bi-person-check"></i> Crea account
      </button>
    </div>

    <p id="message"></p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
