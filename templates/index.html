<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizzy — Accedi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; background: var(--paper); }

    .login-wrap {
      width: min(420px, 94vw);
      animation: fadeInUp .5s ease forwards;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-brand h1 {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 400;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .login-brand p {
      font-size: 0.82rem;
      color: var(--ink-3);
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--r-lg);
      overflow: hidden;
    }

    .tab-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--rule);
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-radius: 0;
      color: var(--ink-3);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 16px;
      justify-content: center;
      transition: color .15s, background .15s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab-btn:hover { background: var(--paper); color: var(--ink); }
    .tab-btn.active {
      color: var(--ink);
      border-bottom-color: var(--ink);
      background: transparent;
    }

    .tab-panel { display: none; padding: 32px 36px 36px; }
    .tab-panel.active { display: block; }

    .field-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-3);
      font-family: var(--font-mono);
      display: block;
      margin-bottom: 4px;
      margin-top: 18px;
    }

    .field-label:first-child { margin-top: 0; }

    .submit-btn {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      justify-content: center;
      font-size: 0.875rem;
      letter-spacing: 0.04em;
    }

    .role-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .role-option {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--rule);
      border-radius: var(--r-sm);
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--ink-2);
      transition: border-color .12s, background .12s;
      margin: 0;
    }
    .role-option:has(input:checked) {
      border-color: var(--ink);
      background: var(--paper);
      color: var(--ink);
    }
    .role-option:hover { border-color: var(--rule-dark); }

    #message {
      font-size: 0.82rem;
      text-align: center;
      margin-top: 14px;
      color: var(--danger);
      min-height: 20px;
    }

    .login-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.75rem;
      color: var(--ink-4);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <h1>Quizzy</h1>
      <p>Sistema di valutazione digitale</p>
    </div>

    <div class="login-box">
      <div class="tab-strip">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Accedi</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Registrati</button>
      </div>

      <div id="panel-login" class="tab-panel active">
        <span class="field-label">Username</span>
        <input type="text" id="login_username" placeholder="Il tuo username">

        <span class="field-label">Password</span>
        <input type="password" id="login_password" placeholder="••••••••">

        <button class="submit-btn" onclick="login()">
          <i class="bi bi-arrow-right-short" style="font-size:16px;"></i> Accedi
        </button>
      </div>

      <div id="panel-register" class="tab-panel">
        <span class="field-label">Username</span>
        <input type="text" id="reg_username" placeholder="Scegli username">

        <span class="field-label">Password</span>
        <input type="password" id="reg_password" placeholder="Crea password">

        <span class="field-label">Ruolo</span>
        <div class="role-row">
          <label class="role-option">
            <input type="radio" name="reg_ruolo" value="studente" id="r_stud" checked style="width:14px;height:14px;margin:0;">
            Studente
          </label>
          <label class="role-option">
            <input type="radio" name="reg_ruolo" value="docente" id="r_doc" style="width:14px;height:14px;margin:0;">
            Docente
          </label>
        </div>

        <button class="submit-btn" onclick="registerNew()">
          <i class="bi bi-person-plus" style="font-size:14px;"></i> Registrati
        </button>
      </div>

      <p id="message"></p>
    </div>

    <p class="login-footer">Quizzy &mdash; Vallauri EDU &copy; 2025</p>
  </div>

  <script src="/static/script.js"></script>
  <script>
    function switchTab(mode) {
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-register').classList.toggle('active', mode === 'register');
      document.getElementById('panel-login').classList.toggle('active', mode === 'login');
      document.getElementById('panel-register').classList.toggle('active', mode === 'register');
      document.getElementById('message').textContent = '';
    }

    function registerNew() {
      const ruolo = document.querySelector('input[name="reg_ruolo"]:checked').value;
      const fakeSelect = document.createElement('select');
      fakeSelect.id = 'reg_ruolo';
      fakeSelect.innerHTML = `<option value="${ruolo}" selected></option>`;
      document.body.appendChild(fakeSelect);
      register();
      document.body.removeChild(fakeSelect);
    }
  </script>
</body>
</html>
