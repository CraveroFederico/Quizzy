<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizzy — Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .quiz-meta {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--ink-4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .question-number {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--ink-4);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      display: block;
    }

    .question-block h3 {
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .submit-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 32px;
    }

    .submit-row button {
      padding: 12px 28px;
      font-size: 0.875rem;
    }

    #result {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 400;
      margin-top: 0;
    }

    .progress-bar-wrap {
      height: 2px;
      background: var(--rule);
      border-radius: 1px;
      margin-bottom: 40px;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--ink);
      border-radius: 1px;
      transition: width .3s ease;
    }
  </style>
</head>
<body>

  <header class="topbar slide-down d-flex justify-content-between align-items-center">
    <div style="display:flex;align-items:center;gap:14px;">
      <span class="logo">Quizzy</span>
      <span class="badge">Quiz in corso</span>
    </div>
  </header>

  <div class="container">

    <div id="quiz-header" class="fade-in" style="margin-bottom:32px;">
      <p class="quiz-meta">Quiz attivo</p>
      <h1 id="quiz_title"></h1>
      <p class="page-intro fade-in fade-delay-1">Seleziona una risposta per ogni domanda, poi invia.</p>
      <div class="progress-bar-wrap fade-in fade-delay-2">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <div id="quiz_form" class="fade-in fade-delay-2"></div>

    <div class="submit-row fade-in fade-delay-3">
      <button onclick="submitQuiz()">
        <i class="bi bi-send" style="font-size:13px;"></i> Invia risposte
      </button>
      <h2 id="result" style="margin:0;"></h2>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
  <script>
    var titolo = localStorage.getItem("quiz");

    fetch("/get_quiz/" + titolo)
      .then(res => res.json())
      .then(data => {
        document.getElementById("quiz_title").innerText = data.titolo;
        var form = document.getElementById("quiz_form");
        var total = data.domande.length;

        for (var i = 0; i < total; i++) {
          var d = data.domande[i];

          var block = document.createElement("div");
          block.className = "question-block hover-lift";

          var idx = i + 1;
          block.innerHTML = `<span class="question-number">${idx} / ${total}</span><h3>${d.testo}</h3>`;

          for (var j = 0; j < d.opzioni.length; j++) {
            var lbl = document.createElement("label");
            lbl.innerHTML = `<input type="radio" name="q${i}" value="${j}" style="width:15px;height:15px;margin:0;"> ${d.opzioni[j]}`;

            (function(labelEl, qi) {
              labelEl.querySelector('input').addEventListener('change', function() {
                var answered = document.querySelectorAll('input[type=radio]:checked').length;
                document.getElementById('progress-fill').style.width = (answered / total * 100) + '%';
              });
            })(lbl, i);

            block.appendChild(lbl);
          }
          form.appendChild(block);
        }
      });
  </script>

</body>
</html>
